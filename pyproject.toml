[project]
name = "sessionrecall"
dynamic = ["readme"]
version = "0.1.0"
description = "Semantic search over your past coding-agent sessions. Local, private, no cloud."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5",
    "numpy",
]
keywords = ["claude-code", "codex", "opencode", "semantic-search", "embeddings", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]

[project.scripts]
recall = "sessionrecall.cli:main"
recall-inject = "sessionrecall.background:inject_main"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]

[dependency-groups]
dev = ["pytest>=8", "mcp>=2"]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionrecall"]

[tool.hatch.build.targets.sdist]
exclude = ["demo", "docs/*.gif", "docs/*.png"]

# PyPI cannot resolve the README's relative links and images; point them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)]+\.(?:gif|png))\)'
replacement = '](https://raw.githubusercontent.com/elyesghazel/sessionrecall/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/elyesghazel/sessionrecall/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and runs the real embedding model (set SESSIONRECALL_TEST_MODEL=1)"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["demo/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sessionrecall", "conftest"]

[tool.ruff.lint.per-file-ignores]
"demo/build_corpus.py" = ["E501"]  # session text, one turn per line
